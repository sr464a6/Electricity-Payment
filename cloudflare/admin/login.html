<div class="icon">
    🛡️
</div>

<h1>Login Admin</h1>

<p class="subtitle">
    Masuk ke panel administrator
</p>


<div
    id="errorMessage"
    class="error-message"
></div>


<form id="adminLoginForm">

    <div class="mb-3">

        <label
            for="username"
            class="form-label"
        >
            Username Admin
        </label>

        <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Masukkan username admin"
            autocomplete="username"
            required
        >

    </div>


    <div class="mb-3">

        <label
            for="password"
            class="form-label"
        >
            Password
        </label>

        <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
        >

    </div>


    <button
        type="submit"
        class="btn-login"
        id="loginButton"
    >

        <span id="loginText">
            Login Admin
        </span>

        <span
            id="loadingText"
            class="loading"
        >
            Memproses...
        </span>

    </button>

</form>


<div class="admin-warning">
    ⚠️ Halaman ini khusus administrator.
</div>


<a
    href="index.html"
    class="back"
>
    ← Kembali
</a>
```

</div>

<script>

const form =
    document.getElementById("adminLoginForm");

const errorMessage =
    document.getElementById("errorMessage");

const loginButton =
    document.getElementById("loginButton");

const loginText =
    document.getElementById("loginText");

const loadingText =
    document.getElementById("loadingText");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        errorMessage.style.display = "none";


        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        if (!username || !password) {

            errorMessage.textContent =
                "Username dan password wajib diisi.";

            errorMessage.style.display =
                "block";

            return;
        }


        loginButton.disabled = true;

        loginText.style.display =
            "none";

        loadingText.style.display =
            "inline";


        try {

            /*
             * NANTI DIHUBUNGKAN KE:
             *
             * Cloudflare Worker
             * +
             * Cloudflare D1
             *
             * Endpoint:
             *
             * /api/admin/login
             */


            errorMessage.textContent =
                "Sistem login admin belum terhubung ke database.";

            errorMessage.style.display =
                "block";


        } catch (error) {

            errorMessage.textContent =
                "Terjadi kesalahan. Silakan coba lagi.";

            errorMessage.style.display =
                "block";


        } finally {

            loginButton.disabled = false;

            loginText.style.display =
                "inline";

            loadingText.style.display =
                "none";

        }

    }
);

</script>

</body>
</html>
